// Classes the Compose compiler must treat as stable.
//
// The :innertube module applies no Compose compiler plugin (it is a plain
// networking library), so none of its models carry @StabilityInferred metadata
// and the compiler treats every one of them as unconditionally unstable. That
// made YouTubeListItem / YouTubeGridItem — i.e. nearly every row and tile on the
// Home feed — non-skippable, so they recomposed on every parent recomposition.
//
// Safe to declare: YTItem and its subtypes are data classes whose properties are
// all immutable vals, so equals() is a correct skip test.
com.music.innertube.models.*
